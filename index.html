<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EduPulse</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&family=Righteous&display=swap" rel="stylesheet">

<style>
:root{--n:#3F518F;--t:#74B9AF;--lb:#BEDFF4;--pb:#D9E4EE;--li:#E6C3F2;--cr:#F8F2DF;--bg:#FFFEF8;--mu:#56608A;--tl:#CFEAE5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--n);font:500 17px Nunito,system-ui,sans-serif}
.app{display:flex;height:100%}
.rail{width:104px;flex:none;background:#fff;border-right:2px solid var(--lb);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.rail button{width:84px;height:72px;border:0;border-radius:22px;background:none;color:var(--n);font:700 13px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.rail button.on{background:var(--pb)}
main{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px;overflow:auto}
main.live{padding:20px;gap:14px;overflow:hidden}
h1,h2,.big{font:400 28px Righteous,sans-serif;margin:0}
h2{font-size:22px}
.card{background:#fff;border:2px solid var(--lb);border-radius:26px;padding:20px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
.btn{border:0;border-radius:30px;background:var(--n);color:var(--cr);font:700 18px Nunito,sans-serif;min-height:52px;padding:0 26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn.l{background:var(--li);color:var(--n)}.btn.p{background:var(--pb);color:var(--n)}.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:6px 14px;border-radius:18px;background:var(--pb);font:700 14px Nunito,sans-serif}.chip.ok{background:var(--tl)}.chip.bad{background:var(--li)}
input,select{width:100%;height:48px;border-radius:24px;border:2px solid var(--lb);background:var(--cr);padding:0 18px;font:500 17px Nunito,sans-serif;color:var(--n)}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--pb)}
.mu{color:var(--mu)}
.q{font:700 clamp(22px,4vw,42px) Nunito,sans-serif;line-height:1.25}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;align-items:center;gap:16px;border-radius:24px;border:3px solid var(--lb);background:var(--cr);padding:0 22px;font:700 clamp(18px,3vw,30px) Nunito,sans-serif;min-height:80px}
.tile b{width:56px;height:56px;border-radius:18px;background:var(--n);color:var(--cr);display:flex;align-items:center;justify-content:center;font:400 30px Righteous,sans-serif;flex:none}
.tile.key{background:var(--tl);border-color:var(--t)}
.bar{height:20px;border-radius:10px;background:var(--pb)}.bar i{display:block;height:100%;border-radius:10px;background:var(--t)}
:focus-visible{outline:3px solid var(--t);outline-offset:2px}
@media(orientation:portrait){.app{flex-direction:column-reverse}.rail{width:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:2px solid var(--lb);padding:6px}}
@media print{.rail,.np{display:none!important}body{background:#fff}main{overflow:visible}}
textarea{width:100%;height:120px;border-radius:18px;border:2px solid var(--lb);background:var(--cr);padding:12px 16px;font:500 16px Nunito,sans-serif;color:var(--n)}
.sec{display:none}.sec.on{display:block}.sec>.card,.sec>.row{margin-bottom:16px}
.ch text{fill:var(--n);font:700 11px Nunito,sans-serif;text-anchor:middle}.ch .x{fill:var(--mu);font-weight:500}
.po{display:none}
@page{size:A4;margin:14mm}
@media print{.sec{display:block}.po{display:block;font:400 22px Righteous,sans-serif;margin-bottom:12px}.card,tr{break-inside:avoid}html,body{height:auto}.app{display:block;height:auto}main{height:auto}h1{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.ic{width:22px;height:22px;margin-right:10px;flex:none}.btn:not(.l):not(.p) .ic{filter:brightness(0) invert(1)}
.rail button{white-space:nowrap}.rail.c{width:72px}.rail.c button{width:56px;height:56px}.rail.c .lb{display:none}
@media(orientation:portrait){.rail .tg{display:none}.rail.c{width:auto}}

/* ---- playful outlined look ---- */
:root{--ink:#27336B}
body{background-image:radial-gradient(var(--pb) 1.6px,transparent 1.6px);background-size:22px 22px}
h1{display:inline-block;align-self:flex-start;background:linear-gradient(transparent 58%,var(--li) 58%);padding:0 6px;margin-left:-6px}
.card{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:22px}
.btn{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.btn:disabled{box-shadow:none}
input,select,textarea{border:3px solid var(--ink)}
.chip{border:2px solid var(--ink)}
.stat:nth-child(3n+1){background:var(--tl)}.stat:nth-child(3n+2){background:#E6F2FB}.stat:nth-child(3n){background:#F4E4FA}
.rail{border-right:3px solid var(--ink)}.rail button{border:3px solid transparent}
.rail button.on{background:var(--li);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.tile{border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}.tile b{background:var(--ink)}
.bar{border:3px solid var(--ink);height:24px}.bar i{border-radius:7px}
main.fit{overflow:hidden}
.split{display:flex;gap:14px;flex:1;min-height:0}
.pane{display:flex;flex-direction:column;gap:10px;min-height:0;width:260px;flex:none}
.pane.main2{flex:1;width:auto;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:14px}
.list{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;padding:2px 2px 6px}
.grow{flex:1;min-height:0}.pane textarea{height:auto;resize:none}
.li{text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:700 16px Nunito,sans-serif;color:var(--n);box-shadow:0 3px 0 var(--ink)}
.li.on{background:var(--li)}
.sm{min-height:40px!important;font-size:15px!important;padding:0 16px!important}
.sess{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px}.pls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.edbar{display:flex;gap:10px;align-items:center;flex:none}.edbar input{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ch2{display:flex;gap:8px;align-items:center}.ch2 input{height:44px;min-width:0}
.key{width:44px;height:44px;flex:none;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--n);font:400 22px Righteous,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.key.on{background:var(--t);color:var(--ink)}
.edfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.edfoot label{display:flex;align-items:center;gap:8px;font-weight:700}.edfoot input{width:80px;height:40px}
@media(max-height:480px){main{padding:12px;gap:10px}main.live{padding:12px;gap:8px}h1{font-size:22px}.card{padding:12px;border-radius:18px}.btn{min-height:42px;font-size:16px;padding:0 18px}.rail{gap:4px;padding:8px 0;overflow-y:auto}.rail>img{display:none}.rail button{height:46px;width:66px}.rail .lb{font-size:10px}.rail button img{width:24px;height:24px}.big{font-size:22px}.q{font-size:clamp(18px,3.2vw,30px)}.tile{min-height:56px}.tile b{width:44px;height:44px;font-size:24px}}

/* ---------- navigation ---------- */
function go(t){tab=G&&t==='Session'?'Live':t;render()}
const TABS=['Home','Classes','Quizzes','Session','Analysis'];
let nav=LS.g('ep.nav',0);
function tog(){nav=nav?0:1;LS.s('ep.nav',nav);render()}
function render(){
  const live=G&&tab==='Live',R=$('#rail');
  R.style.display=live?'none':'';R.className='rail'+(nav?' c':'');
  const b=(k,i)=>`<button class="${k===tab?'on':''}" onclick="go('${k}')" aria-label="${k}"><img src="${IMG[i]}" width="30" height="30" alt=""><span class="lb">${k}</span></button>`;
  R.innerHTML=`<button class="tg" onclick="tog()" aria-label="Collapse or expand menu"><img src="${IMG.Side}" width="30" height="30" alt=""></button><img src="${IMG.Logo}" width="${nav?40:60}" height="${nav?40:60}" alt="EduPulse" style="margin-bottom:8px">`+TABS.map(k=>b(k,k+(k===tab?'On':'Off'))).join('')+'<div style="flex:1"></div>'+b('Guide','Guide');
  $('#m').className=live?'live':(tab=='Classes'||(tab=='Quizzes'&&ed))?'fit':'';
  $('#m').innerHTML=({Home,Classes,Quizzes,Session,Live,Analysis,Guide})[tab]();
}

const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const lp=p=>p>=.8?'Easy':p>=.3?'Moderate':'Hard',ld=d=>d==null?'—':d>=.4?'Excellent':d>=.3?'Good':d>=.2?'Fair':'Poor',lk=r=>r==null?'—':r>=.9?'Excellent':r>=.8?'Good':r>=.7?'Acceptable':r>=.6?'Questionable':r>=.5?'Poor':'Unacceptable';
function scope(){const t=af.quiz||(sessions.length?sessions[sessions.length-1].title:'');return{t,S:sessions.filter(s=>s.title==t&&(!af.cls||s.cls==af.cls))}}
function calc(S){   // pools every matching session: each player in each session is one examinee
  if(!S.length)return null;
  const qs=S[0].qs,k=qs.length,R=[];
  S.forEach(s=>s.pl.forEach(p=>R.push({n:p.n,sc:p.sc,max:s.max,pct:100*p.sc/s.max,d:s.date,it:qs.map(q=>{const e=s.log.find(l=>l[0]==q.n&&l[1]==p.n);return e&&e[3]?1:0})})));
  const n=R.length,pc=R.map(r=>r.pct),m=avg(pc),sd=n>1?Math.sqrt(avg(pc.map(x=>(x-m)**2))*n/(n-1)):0;
  const T=R.map(r=>r.it.reduce((a,b)=>a+b,0)),tm=avg(T),tv=avg(T.map(x=>(x-tm)**2));
  const g=Math.max(1,Math.round(n*.27)),ord=R.map((_,i)=>i).sort((a,b)=>T[b]-T[a]);
  const I=qs.map((q,j)=>{const p=avg(R.map(r=>r.it[j])),c={A:0,B:0,C:0,D:0};S.forEach(s=>s.log.forEach(l=>{if(l[0]==q.n&&c[l[2]]!==undefined)c[l[2]]++}));
    const D=n>=4?avg(ord.slice(0,g).map(i=>R[i].it[j]))-avg(ord.slice(-g).map(i=>R[i].it[j])):null;return{q,p,D,c}});
  const kr=k>1&&tv>0?(k/(k-1))*(1-I.reduce((a,x)=>a+x.p*(1-x.p),0)/tv):null;
  return{R,n,m,sd,hi:Math.max(...pc),lo:Math.min(...pc),kr,I,k}}
function bars(d,h=150){

const sb=x=>{const T=Object.values(x.c).reduce((a,b)=>a+b,0)||1;return `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;min-width:110px;background:var(--pb)">${'ABCD'.split('').map(l=>`<i title="${l}: ${x.c[l]}" style="width:${100*x.c[l]/T}%;background:${l==x.q.k?'var(--t)':'var(--li)'};border-right:1px solid #fff"></i>`).join('')}</div>`};

  const s2=`<div class="card"><h2>Percent correct per question</h2>${bars(a.I.map(x=>({l:x.q.n,v:100*x.p,c:x.p>=.8?'var(--lb)':x.p>=.3?'var(--t)':'var(--li)'})))}<p class="mu">Light blue easy, teal moderate, lilac hard.</p></div><div class="card"><h2>Item analysis</h2><table><tr><th>#</th><th>Question</th><th>Key</th><th>Answers A–D</th><th>Difficulty</th><th>Discrimination</th></tr>${a.I.map(x=>`<tr><td>${x.q.n}</td><td>${esc(x.q.t)}</td><td>${x.q.k}</td><td>${sb(x)}</td><td>${Math.round(100*x.p)}% <span class="chip">${lp(x.p)}</span></td><td>${x.D==null?'—':x.D.toFixed(2)} <span class="chip">${ld(x.D)}</span></td></tr>`).join('')}</table><p class="mu">Teal marks the correct choice. Discrimination needs at least 4 students: run more sessions of the same quiz and they pool here.</p></div>`;
  const by={};a.R.forEach(r=>(by[r.n]=by[r.n]||[]).push(r.pct));
  const stu=Object.entries(by).map(([n,v])=>({n,s:v.length,a:avg(v),b:Math.max(...v)})).sort((x,y)=>y.a-x.a);
  const s3=`<div class="card"><h2>Average score per student</h2>${bars(stu.map(x=>({l:x.n.split(' ')[0].slice(0,6),v:x.a})))}</div><div class="card"><h2>Students</h2><table><tr><th>Student</th><th>Sessions</th><th>Average</th><th>Best</th></tr>${stu.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.s}</td><td>${x.a.toFixed(1)}%</td><td>${x.b.toFixed(1)}%</td></tr>`).join('')}</table></div>`;
  return top+`<div class="row np">${['Summary','Items','Students'].map(x=>`<button class="btn ${x==atab?'':'p'}" onclick="atab='${x}';render()">${x}</button>`).join('')}</div>`+[['Summary',s1],['Items',s2],['Students',s3]].map(([x,h])=>`<div class="sec ${x==atab?'on':''}">${h}</div>`).join('')}

function csv(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
async function readRows(f){
  if(/\.xlsx?$/i.test(f.name)){
    if(typeof XLSX=='undefined'){alert('Spreadsheet support didn’t load. Connect to the internet once, or use a .csv file.');return[]}
    const wb=XLSX.read(await f.arrayBuffer());
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
  return csv((await f.text()).replace(/^\uFEFF/,''))}
async function imp(f){
  if(!f)return;const rw=await readRows(f);
  if(rw.length&&/question/i.test(String(rw[0][1]||'')))rw.shift();
  const qs=rw.map((r,i)=>{const o=r.slice(3,7).map(x=>String(x||'').trim());const ra=String(r[7]||'').trim();let k=ra.toUpperCase();if(!/^[ABCD]$/.test(k)){const j=o.findIndex(x=>x.toLowerCase()==ra.toLowerCase());k=j<0?'':'ABCD'[j]}return{n:i+1,t:String(r[1]||'').trim(),s:+r[2]||20,o,k,pt:+r[8]||1}}).filter(x=>x.t&&x.k);
  if(!qs.length)return alert('No valid questions found. Check the column order and the Right Answer column.');
  quizzes.push({t:f.name.replace(/\.(csv|xlsx?)$/i,''),q:qs});LS.s('ep.q',quizzes);render()}
function tpl(){
  if(typeof XLSX=='undefined')return alert('Spreadsheet support didn’t load. Connect to the internet once, then try again.');
  const ws=XLSX.utils.aoa_to_sheet([['No.','Question','Timer (sec)','Choice A','Choice B','Choice C','Choice D','Right Answer','Points (opt.)'],[1,'The lowest atmospheric layer where weather occurs is the',20,'Troposphere','Stratosphere','Mesosphere','Thermosphere','A',1]]),wb=XLSX.utils.book_new();

/* ---------- serial (HC-05 over Bluetooth RFCOMM) ---------- */
async function connect(i){const p=P[i];p.busy=1;try{if(!p.port)p.port=await navigator.serial.requestPort();await openP(p)}catch(e){alert('Could not connect: '+e.message)}p.busy=0;render()}
async function openP(p){
  try{p.r&&await p.r.cancel()}catch(e){}try{p.w&&p.w.releaseLock()}catch(e){}try{await p.port.close()}catch(e){}
  try{await p.port.open({baudRate:9600})}catch(e){if(e.name!=='InvalidStateError')throw e}
  p.w=p.port.writable.getWriter();p.buf='';p.seen=0;p.up=true;read(p)}
async function read(p){
  const dec=new TextDecoder();
  try{const r=p.r=p.port.readable.getReader();for(;;){const{value,done}=await r.read();if(done)break;p.buf+=dec.decode(value,{stream:true});let i;while((i=p.buf.indexOf('\n'))>=0){line(p,p.buf.slice(0,i).trim());p.buf=p.buf.slice(i+1)}}}catch(e){}
  try{p.r.releaseLock()}catch(e){}p.up=false}
function line(p,s){
  const b=s.lastIndexOf('|');if(b<1||+s.slice(b+1)!==b)return;   // length check: a dropped byte is ignored
  const f=s.slice(0,b).split(',');p.seen=Date.now();
  if(f[0]=='R'&&G&&+f[2]==G.qi+1&&'OW'.includes(G.state)&&p.ans=='-'&&/^[A-D]$/.test(f[3])){p.ans=f[3];p.ms=+f[4]||0}}
async function send(p,s){if(!p.up||!p.w)return;try{await p.w.write(enc.encode(s))}catch(e){p.up=false}}
function msg(p){const c=G?`P,${G.qi+1},${G.state},${G.state=='L'?p.result:G.state=='Z'?p.rank:'-'},${p.score}`:'P,0,I,-,0';return c+'|'+c.length+'\n'}
setInterval(()=>P.forEach((p,i)=>setTimeout(()=>send(p,msg(p)),i*250)),500);   // state sync, staggered per clicker
setInterval(()=>P.forEach(p=>{if(!p.port||p.busy)return;if(p.up&&p.seen&&Date.now()-p.seen>6000)p.up=false;if(!p.up){p.busy=1;openP(p).catch(()=>{}).finally(()=>p.busy=0)}}),3000);   // background reconnect
setInterval(()=>{if(tab=='Session')P.forEach(p=>{const e=$('#c'+p.i);if(e){e.textContent=st(p);e.className='chip '+(st(p)=='Linked'?'ok':'bad')}})},1000);

/* ---------- quiz engine ---------- */
function start(){
  const q=quizzes[sel.quiz];if(!q)return;
  P.forEach(p=>Object.assign(p,{score:0,ans:'-',ms:0,result:'-',rank:'-'}));
  G={q,qi:0,log:[],state:'O',cls:classes[sel.cls]?classes[sel.cls].name:''};openQ(0)}
function openQ(i){
  G.qi=i;G.state='O';G.full=G.dur=G.q.q[i].s*1000;G.left=G.dur;G.t0=performance.now();
  P.forEach(p=>Object.assign(p,{ans:'-',ms:0,result:'-'}));persist();tab='Live';render()}
function endQ(){
  const k=G.q.q[G.qi];
  P.forEach(p=>{const ok=p.ans==k.k;p.result=ok?'C':p.ans=='-'?'N':'X';if(ok)p.score+=k.pt;G.log.push([k.n,p.name,p.ans,ok?1:0,p.ms])});
  G.state='L';G.left=0;persist();render()}
function pause(){
  if('OW'.includes(G.state)){G.keep=G.left;G.state='H'}
  else if(G.state=='H'){G.dur=G.keep;G.t0=performance.now();G.state=G.keep<=5000?'W':'O'}
  persist();render()}
function next(){G.qi+1<G.q.q.length?openQ(G.qi+1):fin()}
function fin(){
  G.state='Z';const m=Math.max(...P.map(p=>p.score));P.forEach(p=>p.rank=p.score==m?'1':'2');
  sessions.push({title:G.q.t,cls:G.cls,date:new Date().toLocaleDateString(),max:G.q.q.reduce((a,x)=>a+x.pt,0),pl:P.map(p=>({n:p.name,sc:p.score})),log:G.log,qs:G.q.q.map(x=>({n:x.n,t:x.t.slice(0,70),k:x.k}))});
  LS.s('ep.s',sessions);af.quiz=G.q.t;af.cls='';persist();render()}
function upd(){
  const t=$('#tm');if(!t)return;
  t.textContent=G.state=='L'?'—':Math.max(0,Math.ceil(G.left/1000));
  $('#bar').style.width=Math.max(0,G.left/G.full*100)+'%';$('#pl').innerHTML=P.map(pc).join('')}
setInterval(()=>{   // 5s warning, time-up, and live refresh without rebuilding the buttons
  if(!G)return;const s0=G.state;
  if('OW'.includes(G.state)){G.left=G.dur-(performance.now()-G.t0);if(G.left<=5000&&G.state=='O')G.state='W';if(G.left<=0)return endQ()}
  if(G.state!=s0)render();else if(tab=='Live')upd()},200);
addEventListener('keydown',e=>{   // keyboard practice mode
  if(!G||!'OW'.includes(G.state))return;
  const k=e.key.toUpperCase(),a='ABCD'.indexOf(k),b='1234'.indexOf(k),p=a>=0?P[0]:b>=0?P[1]:null;
  if(p&&p.ans=='-'){p.ans='ABCD'[a>=0?a:b];p.ms=Math.round(G.dur-G.left)}});

/* ---------- export ---------- */
function resp(S){return S.flatMap(s=>s.log.map(l=>[s.title,s.date,s.cls||'',l[0],l[1],l[2],l[3]?'Yes':'No',l[4]]))}
const RH=['Quiz','Date','Class','Question','Player','Answer','Correct','Response ms'];
function expC(){
  const{t,S}=scope();if(!S.length)return;const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+[RH,...resp(S)].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='EduPulse_'+t.replace(/\W+/g,'_')+'.csv';a.click()}
function expX(){
  if(typeof XLSX=='undefined')return alert('Spreadsheet support didn’t load. Connect to the internet once, then try again, or use CSV.');
  const{t,S}=scope(),a=calc(S);if(!a)return;
  const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n),f=(x,d)=>x==null?'':+x.toFixed(d);
  add('Summary',[['Quiz',t],['Class',af.cls||'All classes'],['Students',a.n],['Mean %',f(a.m,1)],['Highest %',f(a.hi,1)],['Lowest %',f(a.lo,1)],['Std dev',f(a.sd,2)],['KR-20',f(a.kr,2)],['KR-20 reading',lk(a.kr)]]);
  add('Items',[['#','Question','Key','A','B','C','D','Difficulty (p)','Discrimination (D)'],...a.I.map(x=>[x.q.n,x.q.t,x.q.k,x.c.A,x.c.B,x.c.C,x.c.D,f(x.p,2),f(x.D,2)])]);
  add('Students',[['Student','Date','Score','Max','%'],...a.R.map(r=>[r.n,r.d,r.sc,r.max,f(r.pct,1)])]);
  add('Responses',[RH,...resp(S)]);
  XLSX.writeFile(wb,'EduPulse_'+t.replace(/\W+/g,'_')+'.xlsx')}

/* ---------- quiz editor ---------- */
let ed=null;
const blank=n=>({n,t:'',s:20,o:['','','',''],k:'A',pt:1});
function editQ(i){ed={i,sel:0,q:i<0?{t:'New quiz',q:[blank(1)]}:JSON.parse(JSON.stringify(quizzes[i]))};render()}
function edQ(j,k,v){ed.q.q[j][k]=v}
function addQ(){ed.q.q.push(blank(ed.q.q.length+1));ed.sel=ed.q.q.length-1;render()}
function rmQ(j){ed.q.q.splice(j,1);ed.q.q.forEach((x,n)=>x.n=n+1);ed.sel=Math.max(0,Math.min(ed.sel,ed.q.q.length-1));render()}
function saveQ(){
  const q=ed.q;q.t=q.t.trim()||'Untitled quiz';
  const bad=q.q.findIndex(x=>!x.t.trim()||x.o.some(o=>!o.trim()));
  if(!q.q.length||bad>=0)return alert(!q.q.length?'Add at least one question.':'Question '+(bad+1)+' needs a question and all four choices.');
  if(ed.i<0)quizzes.push(q);else quizzes[ed.i]=q;LS.s('ep.q',quizzes);ed=null;render()}
function Editor(){
  const q=ed.q,j=ed.sel,x=q.q[j];
  if(!x)return `<div class="edbar"><input aria-label="Quiz title" value="${esc(q.t)}" onchange="ed.q.t=this.value"><button class="btn l sm" onclick="addQ()">+ Question</button><button class="btn p sm" onclick="ed=null;render()">Cancel</button></div><div class="card mu">No questions yet. Tap + Question.</div>`;
  const list=q.q.map((y,n)=>`<button class="li ${n==j?'on':''}" onclick="ed.sel=${n};render()"><b>${y.n}. ${esc(y.t.slice(0,34))||'New question'}</b><span class="mu">Answer ${y.k} · ${y.s}s · ${y.pt} pt</span></button>`).join('');
  const ch=['A','B','C','D'].map((l,m)=>`<div class="ch2"><button class="key ${x.k==l?'on':''}" title="Mark ${l} as the right answer" aria-label="Choice ${l}${x.k==l?', right answer':''}" onclick="edQ(${j},'k','${l}');render()">${l}</button><input aria-label="Choice ${l}" placeholder="Choice ${l}" value="${esc(x.o[m])}" onchange="ed.q.q[${j}].o[${m}]=this.value"></div>`).join('');
  return `<div class="edbar"><input aria-label="Quiz title" value="${esc(q.t)}" onchange="ed.q.t=this.value"><button class="btn l sm" onclick="addQ()">+ Question</button><button class="btn sm" onclick="saveQ()">Save</button><button class="btn p sm" onclick="ed=null;render()">Cancel</button></div>
<div class="split"><div class="pane"><div class="list">${list}</div></div>
<div class="pane main2"><textarea aria-label="Question ${x.n}" placeholder="Type the question" style="height:76px;flex:none" onchange="edQ(${j},'t',this.value)">${esc(x.t)}</textarea>
<div class="mu" style="font-size:13px">Tap a letter to mark the right answer.</div><div class="g2">${ch}</div>
<div class="edfoot"><label>Seconds <input type="number" min="3" value="${x.s}" onchange="edQ(${j},'s',+this.value||20)"></label><label>Points <input type="number" min="1" value="${x.pt}" onchange="edQ(${j},'pt',+this.value||1)"></label><button class="btn p sm" onclick="rmQ(${j})">Remove question</button></div></div></div>`}

/* ---------- guide ---------- */
function Guide(){
  const gs=(n,t,d)=>`<div class="card"><h2>${n}. ${t}</h2><p class="mu">${d}</p></div>`;
  return `<h1>Guide</h1><div class="card"><h2>How to use EduPulse</h2><p class="mu">Run quick formative quizzes and quiz bowls with Arduino clickers. Everything stays on this device.</p></div>
${gs(1,'Pair the clickers','Power each clicker, then pair its HC-05 in Android Bluetooth settings (the PIN is usually 1234 or 0000). Use Chrome on Android, or Chrome or Edge on a computer.')}
${gs(2,'Add a class','Open Classes, create a class, and paste or import its student names.')}
${gs(3,'Add a quiz','Open Quizzes. Import an .xlsx or .csv (download the template), or build one with New quiz. Each question has a timer, choices A–D, and a right answer.')}
${gs(4,'Start a session','Open Session, choose the quiz and class, and pick a student for each clicker. Tap Connect and choose the HC-05. When both show Linked, tap Start session. No clickers? Use the keyboard: A–D for Player 1, 1–4 for Player 2.')}
${gs(5,'Run the quiz','Cast your phone to the TV in landscape. Each player presses A–D once per question. You can pause, end a question early, then tap Next question. The results show the correct choice and the scores.')}
${gs(6,'Review and export','Analysis pools sessions of the same quiz and shows the mean, standard deviation, KR-20, difficulty, discrimination, and how answers spread across A–D. Export to Excel or CSV, or save a PDF.')}
<div class="card"><h2>If a clicker drops</h2><p class="mu">It shows Offline and reconnects by itself. A weak power source is the usual cause, so keep clickers charged. Cast over 5 GHz Wi-Fi or an HDMI cable to avoid Bluetooth interference.</p></div>
<div class="card"><h2>About EduPulse</h2><p class="mu">EduPulse is a Bluetooth-based classroom clicker system developed as an undergraduate thesis project. Arduino Nano clickers with HC-05 modules connect to this offline app for formative assessment and group quiz bowls.</p><p class="mu">Author: Jessairra Macinas (Sai), BSEd, Major in Science, Bicol University Tabaco Campus, Magna Cum Laude.</p></div>`}

/* ---------- backup, resume, delete ---------- */
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,quizzes,classes,sessions})],{type:'application/json'}));a.download='EduPulse_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function restore(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.quizzes)||!Array.isArray(d.classes)||!Array.isArray(d.sessions))throw 0;
    if(!confirm('Replace all data on this device with this backup?'))return;
    quizzes=d.quizzes;classes=d.classes;sessions=d.sessions;LS.s('ep.q',quizzes);sv();LS.s('ep.s',sessions);sel.quiz=0;sel.cls='';render()}
  catch(e){alert('That file isn’t an EduPulse backup.')}}
function persist(){LS.s('ep.g',G?{G,P:P.map(p=>({name:p.name,score:p.score,ans:p.ans,ms:p.ms,result:p.result,rank:p.rank}))}:null)}
const resBanner=()=>{const r=LS.g('ep.g',null);return!G&&r&&r.G.state!='Z'?`<div class="card" style="background:var(--tl)"><div class="row" style="align-items:center"><div><b>Unfinished session</b><div class="mu">${esc(r.G.q.t)} · question ${r.G.qi+1} of ${r.G.q.q.length}</div></div><button class="btn" onclick="resume()">${ic('PlayM')}Resume</button><button class="btn p" onclick="LS.s('ep.g',null);render()">Discard</button></div></div>`:''};
function resume(){
  const r=LS.g('ep.g',null);if(!r)return;G=r.G;r.P.forEach((x,i)=>Object.assign(P[i],x));
  if('OWH'.includes(G.state)){G.keep=G.state=='H'&&G.keep?G.keep:G.full;G.left=G.keep;G.state='H'}
  tab='Live';render()}
function delS(){const{t,S}=scope();if(S.length&&confirm('Delete '+S.length+' saved session(s) of “'+t+'”'+(af.cls?' for '+af.cls:'')+'?')){sessions=sessions.filter(x=>!S.includes(x));LS.s('ep.s',sessions);af.quiz='';render()}}

/* ---------- offline ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

render();
</script></body></html>
